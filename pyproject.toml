[project]
name = "verifelis"
version = "1.0.5"
description = "Read-only agent for verified scientific PDF and information retrieval. A white cat works; a black cat verifies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
]

[project.scripts]
verifelis = "verifelis.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/verifelis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
